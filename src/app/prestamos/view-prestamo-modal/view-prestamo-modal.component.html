<div class="modal-header">
  <h5 class="modal-title">Ver préstamo</h5>
  <button type="button" class="close-button" (click)="onClose()">
    <i class="pe-7s-close"></i>
  </button>
</div>

<div class="modal-body">
  <div class="detail-group">
    <div class="detail-item">
      <label>Lector:</label>
      <span>{{ prestamo.lector }}</span>
    </div>

    <div class="detail-item">
      <label>Bibliografía:</label>
      <span>{{ prestamo.bibliografia }}</span>
    </div>

    <div class="detail-item">
      <label>Fecha de Solicitud:</label>
      <span>{{ prestamo.fechaSolicitud | date:'dd/MM/yyyy' }}</span>
    </div>

    <div class="detail-item">
      <label>Estado:</label>
      <span [ngClass]="{
        'badge': true,
        'badge-success': prestamo.estado === 'Activo',
        'badge-warning': prestamo.estado === 'Vencido',
        'badge-info': prestamo.estado === 'Devuelto'
      }">{{ prestamo.estado }}</span>
    </div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="onClose()">Cerrar</button>
</div>
