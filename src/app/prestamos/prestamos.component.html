<div class="content">
  <div class="container-fluid">
    <div class="row">      
        <!-- Título principal fuera del card -->
        <div class="page-title-section mb-4">
          <h4 class="page-title">Préstamos</h4>
        </div>

        <div class="card">
          <div class="card-body">
            <!-- Sección de Filtros -->
            <div class="filters-section mb-4">
              <h5 class="filters-title">Filtros</h5>
              <div class="row">
                <!-- Buscar por título o ID -->
                <div class="col-md-4">
                  <div class="form-group">
                    <label for="searchInput">Buscar por título o ID</label>
                    <div class="search-input-container">
                      <input 
                        type="text" 
                        class="form-control search-input" 
                        id="searchInput" 
                        placeholder="Ingrese título o ID"
                        [(ngModel)]="searchTerm"
                        (input)="applyFilters()">
                      <button 
                        class="search-button" 
                        (click)="applyFilters()">
                        <i class="pe-7s-search"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Fecha de publicación -->
                <div class="col-md-4">
                  <div class="form-group">
                    <label for="publicationDate">Fecha de solicitud</label>
                    <input 
                      type="date" 
                      class="form-control" 
                      id="publicationDate"
                      [(ngModel)]="publicationDate"
                      (change)="applyFilters()">
                  </div>
                </div>

                <!-- Categoría -->
                <div class="col-md-4">
                  <div class="form-group">
                    <label for="category">Estado</label>
                    <select 
                      class="form-control" 
                      id="category"
                      [(ngModel)]="category"
                      (change)="applyFilters()">
                      <option value="">Todos los estados</option>
                      <option *ngFor="let cat of categories" [value]="cat">{{cat}}</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <!-- Título de la lista de préstamos -->
            <div class="documents-title-section mb-3">
              <div class="title-actions-container">
                <div class="title-section">
                  <h5 class="filters-title">Lista de Préstamos</h5>
                  <p class="selection-count">Seleccionados {{getSelectedPrestamos().length}} de {{prestamos.length}}</p>
                </div>
                <div class="action-buttons">
                  <div class="btn-group">
                    <button 
                      class="btn btn-primary" 
                      title="Agregar préstamo"
                      (click)="addPrestamo()">
                      <i class="pe-7s-plus"></i>
                    </button>
                    <button 
                      class="btn btn-danger" 
                      title="Eliminar seleccionados"
                      [disabled]="!getSelectedPrestamos().length"
                      (click)="deletePrestamo(prestamoToEdit!)">
                      <i class="pe-7s-trash"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Tabla de Préstamos -->
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" (change)="selectAll($event)">
                      </div>
                    </th>
                    <th>Nro</th>
                    <th>Fecha de solicitud</th>
                    <th>Lector</th>
                    <th>Bibliografía</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let prestamo of prestamos; let i = index">
                    <td>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" [(ngModel)]="prestamo.selected">
                      </div>
                    </td>
                    <td>{{i + 1}}</td>
                    <td>{{prestamo.fechaSolicitud | date:'dd/MM/yyyy'}}</td>
                    <td>{{prestamo.lector}}</td>
                    <td>{{prestamo.bibliografia}}</td>
                    <td>
                      <span [ngClass]="{
                        'badge': true,
                        'badge-success': prestamo.estado === 'Vigente',
                        'badge-warning': prestamo.estado === 'Vencido',
                        'badge-info': prestamo.estado === 'Devuelto'
                      }">
                        {{prestamo.estado}}
                      </span>
                    </td>
                    <td>
                      <div class="btn-group">
                        <button class="btn btn-sm btn-info" (click)="openViewModal(prestamo)" title="Ver">
                          <i class="pe-7s-look"></i>
                        </button>
                        <button class="btn btn-sm btn-warning" (click)="openEditModal(prestamo)" title="Editar">
                          <i class="pe-7s-pen"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" (click)="openDeleteModal(prestamo)" title="Eliminar">
                          <i class="pe-7s-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>  
  </div>
</div>

<!-- Modales -->
<app-register-prestamo-modal 
  *ngIf="showRegisterModal"
  (closeModal)="onCloseModal()"
  (savePrestamo)="onSavePrestamo($event)">
</app-register-prestamo-modal>

<app-edit-prestamo-modal
  *ngIf="showEditModal"
  [prestamo]="prestamoToEdit"
  (closeModal)="onCloseEditModal()"
  (savePrestamo)="onSaveEditPrestamo($event)">
</app-edit-prestamo-modal>

<app-view-prestamo-modal
  *ngIf="showViewModal"
  [prestamo]="prestamoToView"
  (closeModal)="onCloseViewModal()">
</app-view-prestamo-modal>

<app-confirm-action-modal
  *ngIf="showDeleteConfirmModal"
  title="Eliminar Préstamo"
  message="¿Está seguro que desea eliminar este préstamo? Esta acción no se puede deshacer."
  confirmButtonText="Eliminar"
  (closeModal)="onCloseDeleteConfirmModal()"
  (confirmAction)="onConfirmDelete()">
</app-confirm-action-modal>
